version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: formative_user
      POSTGRES_PASSWORD: formative_password
      POSTGRES_DB: formative_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formative_user -d formative_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://formative_user:formative_password@postgres:5432/formative_ai
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-pipeline:8000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    command: npm run dev

  # FastAPI AI Pipeline
  ai-pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai-pipeline
    environment:
      ENV: development
      API_PORT: 8000
      DATABASE_URL: postgresql://formative_user:formative_password@postgres:5432/formative_ai
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ai-pipeline:/app/ai-pipeline
    command: uvicorn src.main:app --reload --host 0.0.0.0 --port 8000

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: formative-ai-network
